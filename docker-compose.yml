services:
  # 1. Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: DB_HORWORKS
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # Sin esto, MySQL corre en UTC y CURRENT_TIMESTAMP/NOW() quedan
      # desfasados ~6h contra la hora local del navegador (Querétaro,
      # GMT-6). La imagen oficial de mysql ya trae tzdata, así que basta
      # con esta variable.
      TZ: America/Mexico_City
    volumes:
      - mysql_data:/var/lib/mysql
      # Al arrancar por primera vez, ejecuta automáticamente tu script SQL
      - ./database/HorDatabase.sql:/docker-entrypoint-initdb.d/HorDatabase.sql
    ports:
      - "3307:3306"
    healthcheck:
      # docker-compose logs mostró "Connection refused" en el backend: arrancaba
      # antes de que MySQL terminara de inicializar. Este healthcheck hace que
      # "backend" espere de verdad a que MySQL acepte conexiones, no solo a que
      # el contenedor exista.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. Backend Flask API
  backend:
    build: ./backend
    container_name: horworks_backend
    restart: always
    environment:
      # URL de conexión a MySQL en Flask
      - DATABASE_URL=mysql+pymysql://root:${DB_PASSWORD}@db:3306/${DB_NAME}?charset=utf8mb4
      - FLASK_ENV=${FLASK_ENV}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_CALENDAR_TIMEZONE=${GOOGLE_CALENDAR_TIMEZONE}
      - FRONTEND_URL=${FRONTEND_URL}
      # Para los desafíos de "posponer tarea" (app/services/gemini_service.py).
      # Si se deja vacía, el backend usa un banco local de retos de respaldo
      # en vez de tronar — no es obligatoria para que la app funcione.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Mismo motivo que en "db": el Dockerfile ya fija TZ al buildear la
      # imagen, pero se deja explícito aquí también para que quede en un
      # solo lugar visible y no dependa de acordarse de reconstruir.
      - TZ=America/Mexico_City
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend React
  frontend:
    build: ./frontend
    container_name: horworks_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: