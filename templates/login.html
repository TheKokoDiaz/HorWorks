<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesión - HorWorks</title>

    <!-- Hojas de estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <!-- Icono de página -->
    <link rel="shortcut icon" href="{{ url_for('static', filename='icons/shortCutIcon.png') }}">
</head>
<body>

    <main class="login-card">
        <h1 class="login-title">Inicia Sesión</h1>
        
        <form id="loginForm" autocomplete="on" method="post" action="/doLogin">
            <!-- Alerta -->
            {% if(alert | default(False)) %}
            <div class="form-group" style="text-align: center;">
                <span class="alert">Correo o Contraseña incorrectos</span>
            </div>
            {% endif %}

            <!-- Grupo: Correo Electrónico -->
            <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        required 
                        placeholder="tu@correo.com"
                        autocomplete="email"
                    >
                </div>
            </div>

            <!-- Grupo: Contraseña -->
            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input form-input-password" 
                        required 
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                    <!-- Botón para alternar visibilidad de contraseña -->
                    <button 
                        type="button" 
                        id="togglePassword" 
                        class="password-toggle" 
                        aria-label="Mostrar contraseña"
                    >
                        <!-- Icono ojo tachado (password oculto por defecto) -->
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- OCULTAMOS ACCIONES QUE NO HAN SIDO PROGRAMADAS -->
            <!-- Acciones secundarias: Recordarme y Olvidé Contraseña -->
            <!-- <div class="form-actions">
                <label class="checkbox-container">
                    Recordarme
                    <input type="checkbox" id="remember" name="remember">
                    <span class="checkmark"></span>
                </label>
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div> -->

            <!-- Botón de Envío -->
            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <!-- Enlace de registro -->
        <div class="signup-container">
            <a href="/registro" class="signup-link">Registrarse</a>
        </div>
    </main>

    <!-- Script de interactividad básica -->
    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordButton = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        // SVG del ojo abierto (para cuando la contraseña está visible)
        const eyeOpenSVG = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;

        // SVG del ojo tachado (para cuando la contraseña está oculta)
        const eyeClosedSVG = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;

        togglePasswordButton.addEventListener('click', () => {
            // Alternar el tipo de entrada de password a text y viceversa
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Alternar los iconos SVG y la etiqueta accesible
            if (type === 'text') {
                eyeIcon.innerHTML = eyeOpenSVG;
                togglePasswordButton.setAttribute('aria-label', 'Ocultar contraseña');
            } else {
                eyeIcon.innerHTML = eyeClosedSVG;
                togglePasswordButton.setAttribute('aria-label', 'Mostrar contraseña');
            }
        });
    </script>
</body>
</html>
