<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Linesync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>

    <div class="app-container">
        <aside class="sidebar" id="main-sidebar">
            <div class="sidebar-top">
                <div class="menu-icon"><span class="material-symbols-outlined">menu</span></div>
                <nav class="nav-links">
                    <a href="{{ url_for('home') }}"><span class="material-symbols-outlined">home</span> Inicio</a>
                    <a href="#"><span class="material-symbols-outlined">folder</span> Mis Tareas</a>
                    <a href="#"><span class="material-symbols-outlined">calendar_today</span> Calendario</a>
                    <a href="#"><span class="material-symbols-outlined">bar_chart</span> Estadísticas</a>
                    <a href="#"><span class="material-symbols-outlined">group</span> Equipos</a>
                </nav>
            </div>
            <div class="sidebar-bottom">
                <div class="user-profile active">
                    <img src="https://ui-avatars.com/api/?name=Pedro+Angel&background=fca5a5&color=fff" alt="Usuario">
                    <span>Perfil</span>
                </div>
                <a href="#" class="settings-btn"><span class="material-symbols-outlined">settings</span></a>
            </div>
        </aside>

        <main class="main-content">
            
            <div class="profile-container">
                <div class="section-header">
                    <h2>Configuración de Perfil</h2>
                </div>

                <div class="profile-grid">
                    <aside class="profile-summary widget" id="user-status-card">
                        <div class="avatar-container">
                            <img src="https://ui-avatars.com/api/?name=Pedro+Angel&background=fca5a5&color=fff&size=150" alt="Foto de perfil" class="profile-avatar-large" id="display_USU_Foto">
                            <button class="btn-edit-avatar"><span class="material-symbols-outlined">photo_camera</span></button>
                        </div>
                        
                        <h3 class="profile-username" id="display_USU_Usuario">@pedro_santos</h3>
                        
                        <span class="badge status-active" id="display_USU_Estado">Activo</span>

                        <div class="profile-stats-divider"></div>

                        <div class="profile-stats">
                            <div class="stat-item">
                                <div class="stat-icon purple"><span class="material-symbols-outlined">confirmation_number</span></div>
                                <div class="stat-info">
                                    <span>Tickets Disponibles</span>
                                    <strong class="purple-text" id="display_USU_Tickets">5</strong>
                                </div>
                            </div>
                        </div>
                    </aside>

                    <section class="profile-details widget" id="user-data-form">
                        <h3>Datos Personales</h3>
                        <p class="subtitle">Actualiza tu información básica y credenciales de acceso.</p>

                        <form action="#" method="POST" class="profile-form">
                            <input type="hidden" name="USU_Id" id="USU_Id" value="1">

                            <div class="form-row">
                                <div class="form-group full-width">
                                    <label for="USU_Nombre">Nombre Completo</label>
                                    <input type="text" name="USU_Nombre" id="USU_Nombre" value="Pedro Angel Santos Bautista" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="USU_Usuario">Nombre de Usuario</label>
                                    <input type="text" name="USU_Usuario" id="USU_Usuario" value="pedro_santos" required>
                                </div>
                                <div class="form-group">
                                    <label for="USU_Correo">Correo Electrónico</label>
                                    <input type="email" name="USU_Correo" id="USU_Correo" value="pedro@ejemplo.com" required>
                                </div>
                            </div>

                            <h3 class="section-divider">Seguridad</h3>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="USU_Contrasenia">Contraseña</label>
                                    <input type="password" name="USU_Contrasenia" id="USU_Contrasenia" value="********" readonly>
                                    <button type="button" class="btn-text mt-2">Cambiar contraseña</button>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="button" class="btn-secondary">Cancelar</button>
                                <button type="submit" class="btn-primary">Guardar Cambios</button>
                            </div>
                        </form>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='../static/js/home.js') }}"></script>
</body>
</html>
