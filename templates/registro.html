<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regístrate - HorWorks</title>

    <!-- Hojas de Estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">

    <!-- Icono de página -->
    <link rel="shortcut icon" href="{{ url_for('static', filename='icons/shortCutIcon.png') }}">
</head>
<body>

    <main class="register-card">
        <h1 class="register-title">Regístrate</h1>
        
        <form id="registerForm" autocomplete="on" onsubmit="handleRegister(event)" action="{{ url_for('login') }}">
            
            <div class="form-grid">
                
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="nombre" 
                            name="nombre" 
                            class="form-input" 
                            required 
                            placeholder="WXYZ"
                            autocomplete="given-name"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="usuario" class="form-label">Usuario</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="usuario" 
                            name="usuario" 
                            class="form-input" 
                            required 
                            placeholder="WXYZ"
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="apellidos" class="form-label">Apellidos</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="apellidos" 
                            name="apellidos" 
                            class="form-input" 
                            required 
                            placeholder="WXYZ"
                            autocomplete="family-name"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input form-input-password" 
                            required 
                            placeholder="WXYZ"
                            autocomplete="new-password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="password-toggle" 
                            aria-label="Mostrar contraseña"
                        >
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <div class="input-wrapper">
                        <input 
                            type="tel" 
                            id="telefono" 
                            name="telefono" 
                            class="form-input" 
                            required 
                            placeholder="5555"
                            autocomplete="tel"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="correo" class="form-label">Correo</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="correo" 
                            name="correo" 
                            class="form-input" 
                            required 
                            placeholder="WXYZ@email.com"
                            autocomplete="email"
                        >
                    </div>
                </div>

            </div> <div class="checkbox-row">
                <label class="checkbox-container">
                    Acepto los términos y condiciones
                    <input type="checkbox" id="terms" name="terms" required>
                    <span class="checkmark"></span>
                </label>
            </div>

            <div class="actions-row">
                <a href="{{ url_for('login') }}" class="btn-regresar">Regresar</a>
                <button type="submit" class="btn-registrar">Regístrate</button>
            </div>

        </form>
    </main>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordButton = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        const eyeOpenSVG = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;

        const eyeClosedSVG = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;

        togglePasswordButton.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.innerHTML = eyeOpenSVG;
                togglePasswordButton.setAttribute('aria-label', 'Ocultar contraseña');
            } else {
                eyeIcon.innerHTML = eyeClosedSVG;
                togglePasswordButton.setAttribute('aria-label', 'Mostrar contraseña');
            }
        });

        function handleRegister(event) {
            event.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const apellidos = document.getElementById('apellidos').value;
            const usuario = document.getElementById('usuario').value;
            const correo = document.getElementById('correo').value;
            
            console.log('Intento de registro:', { nombre, apellidos, usuario, correo });
            alert('Registro simulado correctamente para el usuario: ' + usuario + "!");
            
            // Una vez que simula el éxito, redirige al login usando la ruta de Flask
            window.location.href = "{{ url_for('login') }}";
        }
    </script>
</body>
</html>
