                <section class="tasks-section" id="tasks-container">
                    <div class="section-header">
                        <h2>Tareas por realizar</h2>
                        <button class="btn-add" id="btn-add-task" title="Añadir tarea"><span class="material-symbols-outlined">add</span></button>
                    </div>

                    {% for tarea in tareas %}
                        <ul class="task-list" id="task-list-items">
                            <li class="task-item" data-task-id="{{ tarea[0] }}">
                                <!-- <div class="task-icon placeholder"></div> -->
                                <div class="task-details">
                                    <h4>{{ tarea[1] }}</h4>
                                    <p>{{ tarea[2] }}</p>
                                </div>
                                <div class="task-actions">
                                    <button><span class="material-symbols-outlined" title="Completar">assignment_turned_in</span></button>
                                    <button><span class="material-symbols-outlined" title="Editar">edit</span></button>
                                    <button><span class="material-symbols-outlined" title="Opciones">more_vert</span></button>
                                </div>
                            </li>
                        </ul>
                    {% else %}
                        <ul class="task-list" id="task-list-items">
                            <li class="task-item" data-task-id="0">
                                <div class="task-details">
                                    <h4>¡Wow! Terminaste con tus pendientes</h4>
                                    <p>¡Estas al día! Añade otra tarea para mantener tu productividad.</p>
                                </div>
                            </li>
                        </ul>
                    {% endfor %}
                </section>
